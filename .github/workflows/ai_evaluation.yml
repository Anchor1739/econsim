name: EconSim Production CI & Strategic Sync

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'ai_agent/**'
  schedule:
    # Runs 4 times daily (00:00, 06:00, 12:00, 18:00 UTC) for real-time market scanning & scenario sync.
    # Consumes < 180 runner minutes/month (well within the 2,000 free tier limit) to avoid any abuse flags.
    # Manual on-demand triggers can be launched anytime from the Actions tab.
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
    # Allows on-demand manual trigger anytime from GitHub Actions tab

concurrency:
  group: econsim-production-pipeline
  cancel-in-progress: true

jobs:
  verify:
    name: Code Integrity & Linter
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, bcmath, zip
        continue-on-error: true

      - name: PHP Syntax Check
        run: |
          find src -name "*.php" -exec php -l {} \;
          php -l public/index.php

  evaluate:
    name: Strategic Evaluator & Market Sync
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai_agent/requirements.txt

      - name: Check Secrets Configuration
        id: check_secrets
        run: |
          if [ -z "${{ secrets.DB_HOST }}" ]; then
            echo "::warning ::DB_HOST secret is not configured in GitHub Secrets. Skipping database sync."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Run Evaluation Agent (NVIDIA NIM)
        if: steps.check_secrets.outputs.configured == 'true'
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL_CA_CONTENT: ${{ secrets.DB_SSL_CA_CONTENT }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL || 'meta/llama-3.1-70b-instruct' }}
        run: |
          python ai_agent/evaluator.py

      - name: Run Market Populator & Catalyst Agent
        if: steps.check_secrets.outputs.configured == 'true'
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL_CA_CONTENT: ${{ secrets.DB_SSL_CA_CONTENT }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL || 'meta/llama-3.1-70b-instruct' }}
        run: |
          python ai_agent/market_populator.py
