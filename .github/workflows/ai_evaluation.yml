name: EconSim AI Evaluation Runner

on:
  schedule:
    # Optimized 30-minute interval to prevent quota exhaustion on GitHub Actions
    - cron: '*/30 * * * *'
  workflow_dispatch:
    # Allows instant manual trigger anytime from GitHub Actions tab

# Prevent redundant runs from overlapping and wasting execution minutes
concurrency:
  group: econsim-ai-runner
  cancel-in-progress: true

jobs:
  evaluate:
    name: Poll & Evaluate Boardroom Memos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r ai_agent/requirements.txt

      - name: Run Evaluation Agent (NVIDIA NIM with Multi-Model Fallback)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL_CA_CONTENT: ${{ secrets.DB_SSL_CA_CONTENT }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL || 'meta/llama-3.1-70b-instruct' }}
        run: |
          python ai_agent/evaluator.py

      - name: Run Market Populator & Catalyst Agent
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL_CA_CONTENT: ${{ secrets.DB_SSL_CA_CONTENT }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL || 'meta/llama-3.1-70b-instruct' }}
        run: |
          python ai_agent/market_populator.py

