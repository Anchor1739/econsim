<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>EconSim — Financial Intelligence & Strategy Terminal</title>

  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#030816">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EconSim">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="/css/driver.css">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('econsim-theme');
        if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('theme-dark');
        }
      } catch(e) {}
    })();
  </script>
</head>
<body>
  <div id="global-loader"></div>
  <div id="app"></div>
  <div id="toast"></div>

  <script src="/js/driver.js?v=2.5"></script>
  <script src="/js/api.js?v=2.5"></script>
  <script src="/js/voice.js?v=2.5"></script>
  <script type="module" src="/js/firebase-init.js?v=2.5"></script>
  <script src="/js/app.js?v=2.5"></script>
</body>
</html>
